kind: Deployment
apiVersion: apps/v1
metadata:
  name: webcolor-red
  labels:
    app: webcolor-red
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webcolor-red
  template:
    metadata:
      labels:
        app: webcolor-red
    spec:
      containers:
        - name: webapp-color
          image: 'docker.io/ronaldsiebes/webapp-color:lite'
          env:
            - name: APP_COLOR
              value: red
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

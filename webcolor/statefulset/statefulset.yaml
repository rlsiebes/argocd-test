kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: webcolor-red
  namespace: jmeter
  labels:
    app: webcolor-red
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webcolor-red
  template:
    metadata:
      labels:
        app: webcolor-red
    spec:
      containers:
        - name: webapp-color
          image: 'docker.io/ronaldsiebes/webapp-color:lite'
          env:
            - name: APP_COLOR
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  serviceName: ''
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain


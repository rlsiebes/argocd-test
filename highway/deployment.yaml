kind: Deployment
apiVersion: apps/v1
metadata:
  name: highway-green
  labels:
    app: highway-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: highway-green
  template:
    metadata:
      labels:
        app: highway-green
    spec:
      containers:
        - name: highway-green
          image: 'docker.io/siddharth67/highway-animation:green'
          env:
            - name: APP_COLOR
              value: red
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
